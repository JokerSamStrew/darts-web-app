<svg width="400" height="400" viewBox="-130 -130 260 260" xmlns="http://www.w3.org/2000/svg">
  <!--
    DARTBOARD DIAGRAM
    Designed using a central mask to create segments efficiently.
  -->

  <defs>
    <!-- The Mask: A circle with black wedges cut out to hide the colored backgrounds -->
    <mask id="board-mask">
      <rect x="-130" y="-130" width="260" height="260" fill="white" />
      <!--
         Defines a single wedge (18 degrees).
         Geometry calculation for 18 degrees: sin(18)=0.309, cos(18)=0.951
         Using inner radius of 80 and outer radius of 100.
      -->
      <path d="M 0 0 L 0 80 L 30.9 -95.1 A 100 100 0 0 1 30.9 95.1 Z" fill="black" />
      <!--
         Define the second wedge to complete the circle (36 degrees total).
         It effectively acts as a 'slice' that covers half the board,
         but we actually repeat the first wedge 20 times via rotation logic below.
      -->
    </mask>

    <!-- Red Segment Color -->
    <path id="sector-red" d="M 0 0 L 0 80 L 30.9 -95.1 A 100 100 0 0 1 30.9 95.1 Z" />

    <!-- Black Segment Color -->
    <path id="sector-black" d="M 0 0 L 0 80 L 30.9 -95.1 A 100 100 0 0 1 30.9 95.1 Z" />
  </defs>

  <!-- BACKGROUND BOARD -->
  <rect x="-130" y="-130" width="260" height="260" fill="#222" />

  <!-- 1. SEGMENTS:
       Layer 1 (Bottom): Black Wedges
       Layer 2 (Top): Red Wedges
       Both are masked by the board-mask to reveal only the wedges.
  -->
  <g mask="url(#board-mask)">
    <!-- Generating 20 wedges of black and red -->
    <g transform="rotate(0)">
      <use href="#sector-black" />
      <use href="#sector-red" />
    </g>
    <g transform="rotate(18)">
      <use href="#sector-black" />
      <use href="#sector-red" />
    </g>
    <g transform="rotate(36)">
      <use href="#sector-black" />
      <use href="#sector-red" />
    </g>
    <g transform="rotate(54)">
      <use href="#sector-black" />
      <use href="#sector-red" />
    </g>
    <g transform="rotate(72)">
      <use href="#sector-black" />
      <use href="#sector-red" />
    </g>
    <g transform="rotate(90)">
      <use href="#sector-black" />
      <use href="#sector-red" />
    </g>
    <g transform="rotate(108)">
      <use href="#sector-black" />
      <use href="#sector-red" />
    </g>
    <g transform="rotate(126)">
      <use href="#sector-black" />
      <use href="#sector-red" />
    </g>
    <g transform="rotate(144)">
      <use href="#sector-black" />
      <use href="#sector-red" />
    </g>
    <g transform="rotate(162)">
      <use href="#sector-black" />
      <use href="#sector-red" />
    </g>
    <g transform="rotate(180)">
      <use href="#sector-black" />
      <use href="#sector-red" />
    </g>
    <g transform="rotate(198)">
      <use href="#sector-black" />
      <use href="#sector-red" />
    </g>
    <g transform="rotate(216)">
      <use href="#sector-black" />
      <use href="#sector-red" />
    </g>
    <g transform="rotate(234)">
      <use href="#sector-black" />
      <use href="#sector-red" />
    </g>
    <g transform="rotate(252)">
      <use href="#sector-black" />
      <use href="#sector-red" />
    </g>
    <g transform="rotate(270)">
      <use href="#sector-black" />
      <use href="#sector-red" />
    </g>
    <g transform="rotate(288)">
      <use href="#sector-black" />
      <use href="#sector-red" />
    </g>
    <g transform="rotate(306)">
      <use href="#sector-black" />
      <use href="#sector-red" />
    </g>
    <g transform="rotate(324)">
      <use href="#sector-black" />
      <use href="#sector-red" />
    </g>
  </g>

  <!-- 2. RINGS: Triple and Double -->
  <!-- Using stroke-width to create the rings without separate paths -->
  <g mask="url(#board-mask)">
    <!-- Triple Ring (Green/Red): Radius 70 -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#009400" stroke-width="20" />
    <circle cx="0" cy="0" r="70" fill="none" stroke="#D40000" stroke-width="20" />

    <!-- Double Ring (Green/Red): Radius 100 -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#009400" stroke-width="20" />
    <circle cx="0" cy="0" r="100" fill="none" stroke="#D40000" stroke-width="20" />
  </g>

  <!-- 3. BULLSEYES -->
  <g>
    <!-- Outer Bull: Green -->
    <circle cx="0" cy="0" r="10" fill="#009400" />
    <!-- Inner Bull: Red -->
    <circle cx="0" cy="0" r="6" fill="#D40000" />
  </g>

  <!-- 4. NUMBERS -->
  <!-- Placed at radius 120, rotated to match segments -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="central">
    <g transform="rotate(0)"><text x="0" y="-118">20</text></g>
    <g transform="rotate(18)"><text x="0" y="-118">1</text></g>
    <g transform="rotate(36)"><text x="0" y="-118">18</text></g>
    <g transform="rotate(54)"><text x="0" y="-118">4</text></g>
    <g transform="rotate(72)"><text x="0" y="-118">13</text></g>
    <g transform="rotate(90)"><text x="0" y="-118">6</text></g>
    <g transform="rotate(108)"><text x="0" y="-118">10</text></g>
    <g transform="rotate(126)"><text x="0" y="-118">15</text></g>
    <g transform="rotate(144)"><text x="0" y="-118">2</text></g>
    <g transform="rotate(162)"><text x="0" y="-118">17</text></g>
    <g transform="rotate(180)"><text x="0" y="-118">3</text></g>
    <g transform="rotate(198)"><text x="0" y="-118">19</text></g>
    <g transform="rotate(216)"><text x="0" y="-118">7</text></g>
    <g transform="rotate(234)"><text x="0" y="-118">16</text></g>
    <g transform="rotate(252)"><text x="0" y="-118">8</text></g>
    <g transform="rotate(270)"><text x="0" y="-118">11</text></g>
    <g transform="rotate(288)"><text x="0" y="-118">14</text></g>
    <g transform="rotate(306)"><text x="0" y="-118">9</text></g>
    <g transform="rotate(324)"><text x="0" y="-118">12</text></g>
    <g transform="rotate(342)"><text x="0" y="-118">5</text></g>
  </g>

</svg>
