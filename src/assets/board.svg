  <!--
    DARTBOARD DIAGRAM
    Designed using a central mask to create segments efficiently.
  -->
  <defs
     id="defs1">
    <!-- The Mask: A circle with black wedges cut out to hide the colored backgrounds -->
    <mask
       id="board-mask">
      <rect
         x="-130"
         y="-130"
         width="260"
         height="260"
         fill="white"
         id="rect1" />
      <!--
         Defines a single wedge (18 degrees).
         Geometry calculation for 18 degrees: sin(18)=0.309, cos(18)=0.951
         Using inner radius of 80 and outer radius of 100.
      -->
      <path
         d="M 0 0 L 0 80 L 30.9 -95.1 A 100 100 0 0 1 30.9 95.1 Z"
         fill="black"
         id="path1" />
      <!--
         Define the second wedge to complete the circle (36 degrees total).
         It effectively acts as a 'slice' that covers half the board,
         but we actually repeat the first wedge 20 times via rotation logic below.
      -->
    </mask>
    <!-- Red Segment Color -->
    <path
       id="sector-red"
       d="M 0 0 L 0 80 L 30.9 -95.1 A 100 100 0 0 1 30.9 95.1 Z" />
    <!-- Black Segment Color -->
    <path
       id="sector-black"
       d="M 0 0 L 0 80 L 30.9 -95.1 A 100 100 0 0 1 30.9 95.1 Z" />
  </defs>
  <!-- BACKGROUND BOARD -->
  <!-- 1. SEGMENTS:
       Layer 1 (Bottom): Black Wedges
       Layer 2 (Top): Red Wedges
       Both are masked by the board-mask to reveal only the wedges.
  -->
  <!-- 2. RINGS: Triple and Double -->
  <!-- Using stroke-width to create the rings without separate paths -->
  <!-- 3. BULLSEYES -->
  <!-- 4. NUMBERS -->
  <!-- Placed at radius 120, rotated to match segments -->
